[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-usage-tracker"
version = "0.2.1"
description = "Codex session usage and API cost tracker with optional provider reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "backports.zstd>=1.0,<2; python_version < '3.14'",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.scripts]
codex-usage = "codex_usage.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_usage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
