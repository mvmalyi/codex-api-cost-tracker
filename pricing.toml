[app]
timezone = "Europe/London"
monthly_budget_usd = "500.00"
rolling_30d_budget_usd = "500.00"
watch_interval_seconds = 5.0
active_sessions_path = "~/.codex/sessions"
archived_sessions_path = "~/.codex/archived_sessions"

# Prices are USD per one million tokens. These are deliberately local and
# static: update this file when your provider's rates change.
# Long-context pricing is selected when a single request's input_tokens value
# exceeds long_context_threshold_tokens.

[models."gpt-6.1-sol"]
long_context_threshold_tokens = 272000

[models."gpt-6.1-sol".short]
input = "2.00"
cached_input = "0.2"
cache_write_input = "2.50"
output = "10.00"

[models."gpt-6.1-sol".long]
input = "4.00"
cached_input = "0.40"
cache_write_input = "5.00"
output = "15.00"

